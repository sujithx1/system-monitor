# System Monitor site for an existing Nginx on the monitoring VM.
#
#   1. Replace monitor.example.com with your domain:  sed -i 's/monitor\.example\.com/your.domain/g' ...
#   2. Dashboard files:  sudo docker build --target dashboard --output type=local,dest=/var/www/system-monitor .
#   3. Certificate:      sudo certbot certonly --nginx -d monitor.example.com --deploy-hook "systemctl reload nginx"
#   4. Install:          sudo cp deploy/nginx/system-monitor.conf /etc/nginx/sites-available/
#                        sudo ln -s ../sites-available/system-monitor.conf /etc/nginx/sites-enabled/
#                        sudo nginx -t && sudo systemctl reload nginx
#
# Only affects requests for its own server_name; every shared name is prefixed im_ so it can sit
# next to other sites. The API is published by docker compose on 127.0.0.1:3000 (API_PUBLISH_PORT).

limit_req_zone $binary_remote_addr zone=im_api:10m rate=20r/s;

# Hashed dashboard assets are immutable; index.html must always be revalidated. The API sets its own.
map $uri $im_cache_control {
    ~^/(api/|health$|ready$)           "";
    ~\.(js|css|svg|png|ico|woff2?)$    "public, max-age=31536000, immutable";
    default                            "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;

    # Declared once here; no location below uses add_header, so all of them inherit these.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control $im_cache_control always;

    location ~ ^/(api/|health$|ready$) {
        limit_req zone=im_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append: the API trusts the right-most entry (TRUST_PROXY=true).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        root /var/www/system-monitor;
        try_files $uri /index.html;
    }
}
